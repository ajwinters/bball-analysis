[project]
name = "bball"
version = "0.1.0"
description = "Shared helpers for bball-analysis: database access, real-data filters, plot style."
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bball"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# marimo cells end in a bare `return` and display their last expression
"**/notebook.py" = ["PLR1711", "B018"]
"**/_notebook.py" = ["PLR1711", "B018"]

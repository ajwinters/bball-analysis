[workspace]
authors = ["Alex Winters <awin117@gmail.com>"]
channels = ["conda-forge"]
name = "bball-analysis"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = "3.12.*"
pandas = ">=3.1.1,<4"
sqlalchemy = ">=2.1.8,<3"
psycopg2 = ">=2.9.13,<3"
python-duckdb = ">=2.0.0,<3"
marimo = ">=0.25.1,<0.26"
matplotlib-base = ">=3.11.2,<4"
pyyaml = ">=6.0.3,<7"
altair = ">=6.3.0,<7"

[pypi-dependencies]
bball = { path = ".", editable = true }

[tasks]
edit = "marimo edit"
new = "python tools/new_analysis.py"
index = "python tools/build_index.py"
